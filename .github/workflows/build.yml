name: Build Trinity Control

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    name: Test and build Windows x64 installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: Run test suite
        run: npm test

      - name: Build Windows NSIS installer
        run: npm run build:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Trinity-Control-Windows-x64
          path: dist/Trinity-Control-Setup-*-x64.exe
          if-no-files-found: error
          compression-level: 0

  mac:
    name: Build and verify macOS installers
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Intel and Apple Silicon DMGs
        run: npm run build:mac

      - name: Verify signatures and DMGs
        run: npm run verify:mac

      - name: Upload verified DMGs
        uses: actions/upload-artifact@v4
        with:
          name: Trinity-Control-Alpha-3-verified-DMGs
          path: dist/*.dmg
          if-no-files-found: error
          compression-level: 0
